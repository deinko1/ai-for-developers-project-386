[tools]
ruby = "3.4"
node = "24"

[env]
# Rails runs on :3000, Vite on :5173 (see frontend/vite.config.ts proxy).
RAILS_ENV = "development"

[tasks.setup]
description = "Install dependencies and prepare the database"
run = "make setup"

[tasks.dev]
description = "Run the Rails API and Vite dev servers together"
run = "make dev"

[tasks.test]
description = "Run backend tests and frontend tests and type checks"
run = "make test"

[tasks.check]
description = "Run linters, tests and type checks"
run = "make check"
